<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>კინო</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #181b22;
      --surface-hover: #20242d;
      --border: #262a33;
      --text: #e8e9ec;
      --text-muted: #8b909c;
      --accent: #e50914;
      --accent-hover: #c40812;
      --error: #ff6b6b;
      --sidebar-width: 220px;
      --bottombar-height: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ---------- ჩატვირთვა და ავტორიზაცია ---------- */

    .splash {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login__card {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 32px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .login__logo {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }

    .login__title {
      font-size: 18px;
      text-align: center;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-error {
      color: var(--error);
      font-size: 14px;
    }

    .form-error a {
      text-decoration: underline;
      word-break: break-all;
    }

    /* ---------- ნავიგაცია: საიდბარი (დესკტოპი) ---------- */

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      z-index: 10;
    }

    .nav__logo {
      font-size: 22px;
      font-weight: 700;
      padding: 0 12px;
    }

    .nav__links {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav__link {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px;
      background: none;
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .nav__link:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .nav__link.is-active {
      background: var(--surface-hover);
      color: var(--text);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .nav__link svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav__link.is-active svg {
      stroke: var(--accent);
    }

    /* „დამატება“ ბმული — გამოყოფილი ღილაკის სახით */
    .nav__link--add {
      margin-top: 12px;
      background: var(--accent);
      color: #fff;
    }

    .nav__link--add:hover,
    .nav__link--add.is-active {
      background: var(--accent-hover);
      color: #fff;
      box-shadow: none;
    }

    .nav__link--add.is-active svg {
      stroke: #fff;
    }

    /* „გასვლა“ საიდბარის ბოლოში */
    .nav__link--logout {
      margin-top: auto;
    }

    /* ---------- მთავარი შიგთავსი ---------- */

    .content {
      margin-left: var(--sidebar-width);
      padding: 32px;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 28px;
      margin-bottom: 24px;
    }

    .page-header .page-title {
      margin-bottom: 0;
    }

    .section-title {
      font-size: 18px;
      margin: 32px 0 14px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .filter,
    .toggle span {
      display: inline-block;
      padding: 8px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-muted);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .filter:hover,
    .toggle span:hover {
      color: var(--text);
    }

    .filter.is-active,
    .toggle input:checked + span {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ფორმაში მონიშვნის ღილაკები (მსახიობის კატეგორია) */
    .toggles {
      display: flex;
      gap: 8px;
    }

    .toggle {
      position: relative;
    }

    .toggle input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .toggle input:focus-visible + span {
      outline: 2px solid var(--text);
    }

    .empty {
      color: var(--text-muted);
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .back:hover {
      color: var(--text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .btn--block {
      width: 100%;
      padding: 14px;
      font-size: 15px;
    }

    .btn--ghost {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn--ghost:hover {
      background: var(--surface-hover);
    }

    .btn--danger {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .btn--danger:hover {
      background: var(--accent);
      color: #fff;
    }

    .form-secondary,
    .profile__actions {
      display: flex;
      gap: 8px;
    }

    .form-secondary {
      justify-content: space-between;
    }

    .profile__actions {
      margin-top: 14px;
    }

    .load-more {
      margin-top: 32px;
    }

    /* ---------- ჩამოსაშლელი სია (მსახიობების არჩევა ფორმაში) ---------- */

    .dropdown {
      position: relative;
    }

    .dropdown__toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
    }

    .dropdown__toggle:focus-visible,
    .dropdown__toggle[aria-expanded="true"] {
      outline: none;
      border-color: var(--accent);
    }

    .dropdown__value {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dropdown__value.is-placeholder {
      color: var(--text-muted);
    }

    .dropdown__toggle svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: none;
      stroke: var(--text-muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.15s;
    }

    .dropdown__toggle[aria-expanded="true"] svg {
      transform: rotate(180deg);
    }

    .dropdown__menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 20;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .dropdown__search {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font: inherit;
      font-size: 14px;
    }

    .dropdown__search:focus {
      outline: none;
      border-color: var(--accent);
    }

    .dropdown__options {
      max-height: 240px;
      overflow-y: auto;
      margin-top: 8px;
    }

    .dropdown__option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .dropdown__option:hover {
      background: var(--surface-hover);
    }

    .dropdown__option input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .dropdown__note {
      padding: 8px 10px;
    }

    /* ---------- ბარათები ---------- */

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 554px);
      gap: 18px;
    }

    .card {
      position: relative;
      display: block;
      background: var(--surface);
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.15s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    /* სურათის ფონზე ფერადი გრადიენტია — ჩანს, თუ სურათი არ არის ან ვერ ჩაიტვირთა */
    .image-box {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      overflow: hidden;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card__body {
      padding: 12px;
    }

    .card__title {
      font-size: 15px;
    }

    /* ლინკის ღილაკები სურათის ქვედა მარჯვენა კუთხეში, ვერტიკალურად */
    .card__media {
      position: relative;
    }

    .card__links {
      position: absolute;
      right: 8px;
      bottom: 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
    }

    /* ღილაკი ნომრისთვის კვადრატულია, წარწერისთვის — ტექსტის სიგანის */
    .card__link {
      min-width: 26px;
      height: 26px;
      padding: 0 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .card__link:hover {
      background: var(--accent);
    }

    .card__main {
      display: block;
    }

    /* რედაქტირებისა და წაშლის ღილაკები სურათის ზედა მარცხენა კუთხეში */
    .card__actions {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      gap: 5px;
    }

    .card__action {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .card__action:hover {
      background: #3a3f4b;
    }

    .card__action--delete:hover {
      background: var(--accent);
    }

    .card__action svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- მსახიობის მიხედვით დაჯგუფებული სია ---------- */

    .group + .group {
      margin-top: 40px;
    }

    .group__header {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .group__header h2 {
      font-size: 18px;
      transition: color 0.15s;
    }

    a.group__header:hover h2 {
      color: var(--accent);
    }

    .group__avatar {
      width: 44px;
      flex-shrink: 0;
      border-radius: 6px;
      overflow: hidden;
    }

    .group__avatar .image-box {
      font-size: 15px;
    }

    /* ---------- მსახიობის გვერდი ---------- */

    .profile {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .profile .image-box {
      width: 226px;
      flex-shrink: 0;
      border-radius: 10px;
    }

    .profile .page-title {
      margin-bottom: 0;
    }

    /* ---------- ფორმები ---------- */

    .form {
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .tabs {
      display: flex;
      background: var(--surface);
      border-radius: 10px;
      padding: 4px;
    }

    .tab {
      position: relative;
      flex: 1;
    }

    .tab input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .tab span {
      display: block;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tab input:checked + span {
      background: var(--accent);
      color: #fff;
    }

    .tab input:focus-visible + span {
      outline: 2px solid var(--text);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field__label {
      font-size: 13px;
      color: var(--text-muted);
    }

    .field input[type="text"],
    .field input[type="url"],
    .field input[type="password"] {
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      font-size: 15px;
    }

    .form .field input[type="text"],
    .form .field input[type="url"] {
      background: var(--surface);
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .link-fields {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* წინ — ღილაკის წარწერა (8 ასომდე), შემდეგ — ლინკი */
    .link-row {
      display: flex;
      gap: 8px;
    }

    .link-row input[name="linkLabels"] {
      width: 110px;
      flex-shrink: 0;
      text-align: center;
    }

    .link-row input[name="links"] {
      flex: 1;
      min-width: 0;
    }

    .preview {
      width: 140px;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ---------- მობილური: ქვედა ბარი ---------- */

    @media (max-width: 768px) {
      .nav {
        top: auto;
        right: 0;
        width: auto;
        height: var(--bottombar-height);
        padding: 0;
        border-right: none;
        border-top: 1px solid var(--border);
      }

      .nav__logo {
        display: none;
      }

      .nav__links {
        flex-direction: row;
        height: 100%;
        gap: 0;
      }

      .nav__link {
        flex: 1;
        justify-content: center;
        padding: 0;
        border-radius: 0;
      }

      .nav__link svg {
        width: 24px;
        height: 24px;
      }

      /* ქვედა ბარში მხოლოდ ხატულებია — წარწერა ეკრანზე არ ჩანს, მაგრამ ეკრანის წამკითხველისთვის რჩება */
      .nav__link span {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .nav__link:hover {
        background: none;
        box-shadow: none;
      }

      /* აქტიური გვერდი — წითელი ხაზი ხატულის თავზე */
      .nav__link.is-active {
        background: none;
        box-shadow: inset 0 2px 0 var(--accent);
      }

      /* ქვედა ბარში „დამატება“ წითელი ხატულაა, ფონის გარეშე */
      .nav__link--add,
      .nav__link--add:hover,
      .nav__link--add.is-active {
        margin-top: 0;
        background: none;
        color: var(--text-muted);
      }

      .nav__link--add.is-active {
        box-shadow: inset 0 2px 0 var(--accent);
      }

      .nav__link--add svg,
      .nav__link--add.is-active svg {
        stroke: var(--accent);
      }

      .nav__link--add.is-active {
        color: var(--text);
      }

      .nav__link--logout {
        margin-top: 0;
      }

      .content {
        margin-left: 0;
        padding: 20px 16px calc(var(--bottombar-height) + 20px);
      }

      .page-title {
        font-size: 22px;
        margin-bottom: 16px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .profile {
        gap: 16px;
        flex-wrap: wrap;
      }

      .profile .image-box {
        width: 171px;
      }
    }
  </style>
</head>
<body>
  <div class="splash" id="splash">იტვირთება...</div>

  <!-- ავტორიზაცია — სხვა არაფერი ჩანს, სანამ ადმინი არ შევა -->
  <section class="login" id="login" hidden>
    <form class="login__card" id="login-form">
      <div class="login__logo">🎬 კინო</div>
      <h1 class="login__title">ადმინის შესვლა</h1>
      <label class="field">
        <span class="field__label">სახელი</span>
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label class="field">
        <span class="field__label">პაროლი</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="login-error" hidden></p>
      <button type="submit" class="btn btn--block">შესვლა</button>
    </form>
  </section>

  <!-- ადმინის პანელი -->
  <div id="panel" hidden>
    <nav class="nav">
      <a href="#home" class="nav__logo">🎬 <span>კინო</span></a>
      <div class="nav__links">
        <a href="#home" class="nav__link" data-page="home">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
          <span>მთავარი</span>
        </a>
        <a href="#movies" class="nav__link" data-page="movies">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>
          <span>ფილმები</span>
        </a>
        <a href="#series" class="nav__link" data-page="series">
          <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>
          <span>ლაივი</span>
        </a>
        <a href="#actors" class="nav__link" data-page="actors">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span>მსახიობები</span>
        </a>
        <a href="#add" class="nav__link nav__link--add" data-page="add">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>დამატება</span>
        </a>
        <button type="button" class="nav__link nav__link--logout" id="logout" title="გასვლა">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
          <span>გასვლა</span>
        </button>
      </div>
    </nav>

    <main class="content" id="app"></main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      initializeAuth,
      indexedDBLocalPersistence,
      browserLocalPersistence,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      signOut,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      query,
      where,
      orderBy,
      limit,
      startAfter,
      writeBatch,
      arrayUnion,
      arrayRemove,
      serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ================= Firebase-ის პარამეტრები =================
    // Firebase Console → ⚙ Project settings → General → Your apps → Config.
    // ეს მონაცემები საიდუმლო არ არის — მონაცემებს Firestore-ის უსაფრთხოების წესები იცავს.
    const firebaseConfig = {
      apiKey: "AIzaSyAis9dWladPNn2QGRQI_URvxIlJMhDIsC4",
      authDomain: "movvid-3120.firebaseapp.com",
      projectId: "movvid-3120",
      storageBucket: "movvid-3120.firebasestorage.app",
      messagingSenderId: "73200484503",
      appId: "1:73200484503:web:f817aec6046b7a7af029d2",
    };

    // შესვლის სახელი ელფოსტად გადაიქცევა: "Admin" → "admin@kino.local".
    // Firebase Authentication-ში ადმინი სწორედ ამ ელფოსტით უნდა შექმნა.
    const LOGIN_EMAIL_DOMAIN = "kino.local";

    // რამდენი მსახიობი ჩაიტვირთოს ერთ ჯერზე (Firestore-ის დღიური ლიმიტის დასაზოგად)
    const PAGE_SIZE = 20;

    const TYPES = {
      movie: { collection: "movies", route: "movies", title: "ფილმები" },
      series: { collection: "series", route: "series", title: "ლაივი" },
      actor: { collection: "actors", route: "actors", title: "მსახიობები" },
    };

    const splash = document.getElementById("splash");
    const loginSection = document.getElementById("login");
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");
    const panel = document.getElementById("panel");
    const app = document.getElementById("app");

    const configured = !firebaseConfig.apiKey.startsWith("PASTE");
    let auth = null;
    let db = null;
    if (configured) {
      const firebaseApp = initializeApp(firebaseConfig);
      // getAuth()-ის ნაცვლად: Google/popup შესვლის დამხმარე iframe არ გვჭირდება და ფაილიდან გახსნისას ჭედავს
      auth = initializeAuth(firebaseApp, { persistence: [indexedDBLocalPersistence, browserLocalPersistence] });
      db = getFirestore(firebaseApp);
    }

    // ================= დამხმარე ფუნქციები =================

    // ტექსტი HTML-ში უსაფრთხოდ რომ ჩაჯდეს
    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]
      );
    }

    // სახელიდან გამოთვლილი ფერადი ფონი
    function placeholderColor(text) {
      let hash = 0;
      for (const ch of text) hash = (hash * 31 + ch.charCodeAt(0)) % 360;
      return `linear-gradient(135deg, hsl(${hash} 55% 35%), hsl(${(hash + 50) % 360} 55% 20%))`;
    }

    function initials(text) {
      return text
        .split(" ")
        .filter(Boolean)
        .map((w) => w[0])
        .slice(0, 2)
        .join("")
        .toUpperCase();
    }

    function isHttpUrl(value) {
      return /^https?:\/\//i.test(value);
    }

    const toItem = (snapshot) => ({ id: snapshot.id, ...snapshot.data() });
    const byName = (a, b) => (a.nameLower || "").localeCompare(b.nameLower || "", "ka");

    // შეცდომის ჩვენება; Firebase-ის ბმულს (მაგ. ინდექსის შესაქმნელს) დასაჭერად აქცევს
    function errorHtml(err) {
      console.error(err);
      const text = escapeHtml(err?.message || String(err)).replace(
        /https:\/\/[^\s<]+/g,
        (url) => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`
      );
      return `<p class="form-error">შეცდომა: ${text}</p>`;
    }

    function imageBox(item) {
      const content = item.image
        ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}" loading="lazy" onerror="this.remove()">`
        : escapeHtml(initials(item.name));
      return `<div class="image-box" style="background:${placeholderColor(item.name)}">${content}</div>`;
    }

    // ლინკი ინახება როგორც { url, label }; ძველი ჩანაწერებში ლინკი უბრალო ტექსტია
    function itemLinks(item) {
      return (item.links || [])
        .map((link) => (typeof link === "string" ? { url: link, label: "" } : { url: link.url || "", label: link.label || "" }))
        .filter((link) => isHttpUrl(link.url));
    }

    // ფილმის/სერიალის ლინკები — ღილაკზე წარწერა ან, თუ ცარიელია, ნომერი 1, 2, 3...
    function linkButtons(item) {
      const links = itemLinks(item);
      if (!links.length) return "";
      return `
        <div class="card__links">
          ${links
            .map((link, i) => {
              const text = link.label || String(i + 1);
              return `<a href="${escapeHtml(link.url)}" class="card__link" target="_blank" rel="noopener" title="${escapeHtml(text)}">${escapeHtml(text)}</a>`;
            })
            .join("")}
        </div>`;
    }

    const ICONS = {
      edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
      delete: '<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
    };

    const TYPE_NAMES = { actor: "მსახიობი", movie: "ფილმი", series: "სერიალი" };

    // წაშლის ღილაკის data-ატრიბუტები (დაჭერას app-ის click handler ამუშავებს)
    function deleteAttrs(item, type) {
      return `data-delete-type="${type}" data-delete-id="${escapeHtml(item.id)}" data-delete-name="${escapeHtml(item.name)}"`;
    }

    function editHref(item, type) {
      return `#edit/${type}/${encodeURIComponent(item.id)}`;
    }

    // type = "actor" / "movie" / "series"; href — სად გადავიდეს ბარათზე დაჭერისას (მსახიობისთვის)
    function card(item, type, href) {
      const content = `
          <div class="card__media">
            ${imageBox(item)}
            ${linkButtons(item)}
          </div>
          <div class="card__body">
            <h2 class="card__title">${escapeHtml(item.name)}</h2>
          </div>`;
      return `
        <article class="card">
          ${href ? `<a href="${href}" class="card__main">${content}</a>` : content}
          <div class="card__actions">
            <a href="${editHref(item, type)}" class="card__action" title="რედაქტირება" aria-label="რედაქტირება">${ICONS.edit}</a>
            <button type="button" class="card__action card__action--delete" ${deleteAttrs(item, type)} title="წაშლა" aria-label="წაშლა">${ICONS.delete}</button>
          </div>
        </article>`;
    }

    function actorHref(actor) {
      return `#actor/${encodeURIComponent(actor.id)}`;
    }

    // ================= Firestore-დან წაკითხვა =================

    // მსახიობების ერთი გვერდი ანბანის მიხედვით; category = "movie" / "series" / null
    async function fetchActorsPage(category, cursor) {
      const constraints = [];
      if (category) constraints.push(where("categories", "array-contains", category));
      constraints.push(orderBy("nameLower"));
      if (cursor) constraints.push(startAfter(cursor));
      constraints.push(limit(PAGE_SIZE));
      const snap = await getDocs(query(collection(db, "actors"), ...constraints));
      return { actors: snap.docs.map(toItem), cursor: snap.docs[snap.docs.length - 1] || cursor, hasMore: snap.docs.length === PAGE_SIZE };
    }

    // ჩანაწერს ტიპიც ახლავს ("movie" / "series"), რომ ბარათმა იცოდეს, რას არედაქტირებს
    const withType = (type) => (snapshot) => ({ ...toItem(snapshot), type });

    // ამ მსახიობების (მაქს. 30) ფილმები/ლაივი
    async function fetchItemsForActors(types, actorIds) {
      if (!actorIds.length) return [];
      const snaps = await Promise.all(
        types.map((t) => getDocs(query(collection(db, TYPES[t].collection), where("actorIds", "array-contains-any", actorIds))))
      );
      return snaps.flatMap((s, i) => s.docs.map(withType(types[i]))).sort(byName);
    }

    // ფილმები/ლაივი, რომლებსაც მსახიობი არ აქვთ მიბმული
    async function fetchItemsWithoutActors(types) {
      const snaps = await Promise.all(
        types.map((t) => getDocs(query(collection(db, TYPES[t].collection), where("actorIds", "==", []))))
      );
      return snaps.flatMap((s, i) => s.docs.map(withType(types[i]))).sort(byName);
    }

    // ================= გვერდები =================

    function pageHeader(title, addHref) {
      return `
        <div class="page-header">
          <h1 class="page-title">${title}</h1>
          <a href="${addHref}" class="btn">+ დამატება</a>
        </div>`;
    }

    // სია ნაწილ-ნაწილ ჩატვირთვით: loadPage() ამატებს შიგთავსს და აბრუნებს { added, hasMore }
    async function paginatedList(container, isCurrent, loadPage) {
      const status = container.querySelector(".list-status");
      const more = container.querySelector(".load-more");
      let total = 0;

      async function next() {
        more.hidden = true;
        status.hidden = false;
        status.textContent = "იტვირთება...";
        try {
          const { added, hasMore } = await loadPage();
          if (!isCurrent()) return;
          total += added;
          status.textContent = "ჯერ არაფერია დამატებული.";
          status.hidden = total > 0;
          more.hidden = !hasMore;
        } catch (err) {
          if (!isCurrent()) return;
          status.hidden = true;
          status.insertAdjacentHTML("beforebegin", errorHtml(err));
        }
      }

      more.addEventListener("click", next);
      await next();
    }

    const listShell = (inner) => `
      ${inner}
      <p class="empty list-status"></p>
      <button type="button" class="btn btn--ghost load-more" hidden>მეტის ჩვენება</button>`;

    // მთავარი (type = null), ფილმები ან ლაივი — დაჯგუფებული მსახიობების მიხედვით (ანბანით)
    async function groupedPage(type, isCurrent) {
      app.innerHTML =
        pageHeader(type ? TYPES[type].title : "მთავარი", type ? `#add/${type}` : "#add") +
        listShell(`<div class="groups"></div>`);
      const groups = app.querySelector(".groups");
      const itemTypes = type ? [type] : ["movie", "series"];
      let cursor = null;

      await paginatedList(app, isCurrent, async () => {
        const isFirstPage = !cursor;
        const page = await fetchActorsPage(type, cursor);
        cursor = page.cursor;
        const items = await fetchItemsForActors(itemTypes, page.actors.map((a) => a.id));
        // მსახიობის გარეშე დარჩენილები — პირველ ადგილზე, „სხვა“-ში (მხოლოდ პირველი გვერდის ჩატვირთვისას)
        const others = isFirstPage ? await fetchItemsWithoutActors(itemTypes) : [];
        if (!isCurrent()) return { added: 0, hasMore: false };

        let html = "";
        if (others.length) {
          html += `
            <section class="group">
              <div class="group__header"><h2>სხვა</h2></div>
              <div class="grid">${others.map((i) => card(i, i.type)).join("")}</div>
            </section>`;
        }
        html += page.actors
          .map((actor) => {
            const own = items.filter((i) => (i.actorIds || []).includes(actor.id));
            return `
              <section class="group">
                <a href="${actorHref(actor)}" class="group__header">
                  <span class="group__avatar">${imageBox(actor)}</span>
                  <h2>${escapeHtml(actor.name)}</h2>
                </a>
                ${own.length ? `<div class="grid">${own.map((i) => card(i, i.type)).join("")}</div>` : `<p class="empty">ჯერ არაფერია დამატებული.</p>`}
              </section>`;
          })
          .join("");
        groups.insertAdjacentHTML("beforeend", html);
        return { added: page.actors.length + others.length, hasMore: page.hasMore };
      });
    }

    // მსახიობების ფილტრი: null = ყველა, "movie" = ფილმების მსახიობები, "series" = ლაივის მსახიობები
    let actorFilter = null;

    async function actorsPage(isCurrent) {
      const filterButton = (type, label) =>
        `<button type="button" class="filter ${actorFilter === type ? "is-active" : ""}" data-actor-filter="${type}" aria-pressed="${actorFilter === type}">${label}</button>`;

      app.innerHTML =
        pageHeader("მსახიობები", "#add/actor") +
        `<div class="filters">${filterButton("movie", "ფილმები")}${filterButton("series", "ლაივი")}</div>` +
        listShell(`<div class="grid"></div>`);
      const grid = app.querySelector(".grid");
      let cursor = null;

      await paginatedList(app, isCurrent, async () => {
        const page = await fetchActorsPage(actorFilter, cursor);
        cursor = page.cursor;
        if (!isCurrent()) return { added: 0, hasMore: false };
        grid.insertAdjacentHTML("beforeend", page.actors.map((a) => card(a, "actor", actorHref(a))).join(""));
        return { added: page.actors.length, hasMore: page.hasMore };
      });
    }

    // მსახიობის გვერდი — ფილმები და ლაივი, რომლებშიც მონაწილეობს
    async function actorPage(id,
